[workspace]
resolver = "2"
members = ["crates/*"]
# Optional: `cargo build` / `cargo run` skip the Qt crate unless you ask for it
default-members = ["crates/domain", "crates/my_app_core", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# internal crates
domain = { path = "crates/domain" }
my_app_core = { path = "crates/my_app_core", package = "my_app_core" }

# shared external deps (versions defined once)
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
sqlx       = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
tracing    = "0.1"
tracing-subscriber = "0.3"
anyhow     = "1"
thiserror  = "2"
